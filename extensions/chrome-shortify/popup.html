<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>OpenShorts 1-Click</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #38bdf8;
    }
    label {
      font-size: 12px;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 13px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #10b981;
    }
  </style>
</head>
<body>
  <h2>⚡ OpenShorts Setup</h2>
  
  <label for="apiUrl">URL da API (Colab / Local / VPS):</label>
  <input type="text" id="apiUrl" placeholder="https://xxxx.trycloudflare.com ou http://localhost:8000" />

  <label for="layout">Layout dos Cortes:</label>
  <select id="layout">
    <option value="auto">Auto (Gemini Frame Decision)</option>
    <option value="split">Split (2 Falantes Stacked)</option>
    <option value="screencast">Screencast / Tela Dividida</option>
    <option value="none">Padrão / Recorte Simples</option>
  </select>

  <label for="subtitleStyle">Estilo de Legenda:</label>
  <select id="subtitleStyle">
    <option value="hormozi">Hormozi (Destaque Amarelo)</option>
    <option value="karaoke">Karaokê Dinâmico</option>
    <option value="clean">Minimalista / Clean</option>
  </select>

  <button id="saveBtn">Salvar Configurações</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
